apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: menu-api
spec: 
  ingressClassName: traefik
  rules: 
    - host: menu.localhost            # overlays replace this per environment
      http: 
        paths: 
          - path: /
            pathType: Prefix
            backend: 
              service: 
                name: menu-api
                port: { name: http }