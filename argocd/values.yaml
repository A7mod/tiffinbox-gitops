global:
  domain: argocd.localhost

configs:
  params: 
    server.insecure: true                                # TLS terminates at Traefik, not argocd-server
  cm:
    ui.bannercontent: "TiffinBox platform - managed by GitOps. Change me via PR, not kubectl."
    ui.bannerpermanent: "true"  


server:
  ingress:
    enabled: true
    ingressClassName: traefik

dex: 
  enabled: false                                         # re-enable in the SSO stage; saves RAM now
