apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tiffinbox-root
  namespace: argocd
spec: 
  project: default
  source: 
    repoURL: https://github.com/A7mod/tiffinbox-gitops.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true  
