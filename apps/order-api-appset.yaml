apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: order-api
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/A7mod/tiffinbox-gitops.git
        revision: main
        directories:
          - path: workloads/order-api/overlays/*
  template:
    metadata:
      name: 'order-api-{{.path.basename}}'
      labels:
        env: '{{.path.basename}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec: 
      project: default
      source:
        repoURL: https://github.com/A7mod/tiffinbox-gitops.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'tb-{{.path.basename}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if ne .path.basename "prod" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}        
